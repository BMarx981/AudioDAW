[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# Cross-platform audio I/O (CoreAudio / WASAPI / ALSA).
cpal = "0.15"
# Lock-free single-producer/single-consumer ring buffer for control -> audio
# messaging. Wait-free push/pop, no allocation — safe on the audio thread.
rtrb = "0.3"
# Audio file decoding. CLAUDE.md's documented decode path: WAV now, with
# FLAC/MP3/AAC/OGG a feature-flag away later. We only enable what Milestone 1
# needs (the WAV container + PCM codec) to keep build times and binary size down;
# add `flac`/`mp3`/etc. to `features` when those formats are wanted. Decoding
# runs on the control thread, never the audio thread, so symphonia allocating
# internally is fine.
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm"] }
# Project file format. JSON for v1 per CLAUDE.md — debuggable and human-readable
# while the data model is still settling. Both crates are tiny and well-trusted.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Dev-only guard that aborts if the audio path allocates. See the cfg(test)
# global allocator in lib.rs and the realtime-safety tests in osc.rs.
assert_no_alloc = "1.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
